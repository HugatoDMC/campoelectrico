<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Niveles · Campo Eléctrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#060a14; --panel:rgba(10,16,32,.85); --card:#0f1830; --line:#1b2a4a; --cyan:#7fe0ff; --blue:#4f9dff; --gold:#ffc800; --text:#e8eefb; --mute:#8f9dbd; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: radial-gradient(ellipse 70% 45% at 50% 100%, #0e2a4d 0%, transparent 70%), var(--bg); background-attachment: fixed; color: var(--text); min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
                 background-image: linear-gradient(rgba(127,224,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(127,224,255,.05) 1px, transparent 1px);
                 background-size: 44px 44px; -webkit-mask-image: linear-gradient(#000, transparent 75%); mask-image: linear-gradient(#000, transparent 75%); }
  button:focus-visible, a:focus-visible, .card:focus-visible, .row:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .wrap { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 22px 20px 48px; }

  .topbar { display: flex; align-items: center; margin-bottom: 14px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); text-decoration: none; font-size: 14px; font-weight: 600;
          padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(10,16,32,.8);
          transition: color .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .back:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 14px rgba(255,200,0,.3); }

  .search { width: 100%; padding: 14px 18px 14px 46px; border-radius: 14px; border: 1px solid var(--line); color: var(--text); font-size: 16px; outline: none;
            background: rgba(10,16,32,.85) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%238f9dbd' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat 16px center;
            transition: border-color .2s, box-shadow .2s; }
  .search:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(127,224,255,.15), 0 0 20px rgba(127,224,255,.2); }
  .panel { position: relative; margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px;
           backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(127,224,255,.18); }
  .panel::before { content: ""; position: absolute; left: 50%; top: -1px; width: 90px; height: 3px; margin-left: -45px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 16px var(--gold); }
  h1 { font-family: "Chakra Petch", system-ui, sans-serif; text-align: center; color: var(--gold); margin: 6px 0 18px; font-size: 36px; font-weight: 700; letter-spacing: .02em; text-shadow: 0 0 18px rgba(255,200,0,.45), 0 0 2px rgba(255,200,0,.8); }

  .tabs { display: flex; justify-content: center; gap: 4px; width: fit-content; margin: 0 auto 28px; padding: 4px; border-radius: 999px; background: #0a1020; border: 1px solid var(--line); }
  .tab { background: transparent; color: var(--mute); border: 1px solid transparent; padding: 8px 22px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; transition: color .2s, background .2s, box-shadow .2s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: #1a1300; background: var(--gold); box-shadow: 0 0 16px rgba(255,200,0,.45); }

  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-bottom: 28px; }
  .card { --av: 96px; --bd: 90px; --glow: #4f9dff;
          position: relative; flex: 1; min-width: 0; max-width: 236px; border-radius: 20px; text-align: center; padding: 18px 12px;
          background: linear-gradient(#142042, #0a1020); border: 1px solid var(--line); cursor: pointer;
          transition: transform .25s ease, box-shadow .25s ease; }
  .card.first { --av: 120px; --bd: 112px; padding-top: 28px; padding-bottom: 22px; background: linear-gradient(#33290a, #0a1020 85%); border-color: #ffc800; box-shadow: 0 0 34px rgba(255,200,0,.28); --glow: #ffc800; }
  .card.second { --av: 100px; --bd: 94px; background: linear-gradient(#2a2f3b, #0a1020 85%); border-color: #aab2c4; --glow: #aab2c4; }
  .card.third { --av: 84px; --bd: 78px; background: linear-gradient(#35200f, #0a1020 85%); border-color: #b06a30; --glow: #b06a30; }
  .card:hover { transform: translateY(-6px); box-shadow: 0 0 30px var(--glow), 0 14px 30px rgba(0,0,0,.4); }

  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
  .spark { position: absolute; border-radius: 50%; background: var(--c); opacity: 0;
           width: var(--s); height: var(--s);
           box-shadow: 0 0 6px var(--c), 0 0 12px var(--c);
           animation: rise var(--d) ease-out var(--dl) infinite; }
  @keyframes rise {
    0%   { opacity: 0; transform: translate(0, 0) scale(1); }
    15%  { opacity: var(--max); }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--ry) * -1)) scale(.2); }
  }

  .name { font-weight: 700; margin: 14px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 14px; color: var(--mute); }

  .avatar { position: relative; width: var(--av, 96px); height: var(--av, 96px); margin: 0 auto; flex-shrink: 0; }
  .avatar img.pfp { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1b2a4a; display: block; }
  .avatar img.deco { position: absolute; left: 50%; top: 50%; width: 140%; height: 140%; transform: translate(-50%, -50%); pointer-events: none; }

  .badge { position: relative; width: var(--bd); height: var(--bd); margin: 8px auto 0; display: flex; align-items: center; justify-content: center; }
  .laurel { position: absolute; inset: 0; width: 100%; height: 100%; }
  .num { position: relative; font-family: "Chakra Petch", system-ui, sans-serif; font-size: 34px; font-weight: 700; }
  .card.first .num { font-size: 44px; }
  .card.second .num { font-size: 36px; }
  .card.third .num { font-size: 30px; }

  .row { position: relative; display: flex; align-items: center; gap: 16px; background: linear-gradient(90deg, rgba(20,32,60,.9), rgba(10,16,32,.85)); border: 1px solid var(--line); border-radius: 16px;
         padding: 10px 18px 10px 14px; margin-bottom: 8px; cursor: pointer; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .row::before { content: ""; position: absolute; left: 0; top: 16%; bottom: 16%; width: 3px; border-radius: 0 3px 3px 0; background: var(--blue); box-shadow: 0 0 10px var(--blue); }
  .row:hover { transform: translateX(5px); border-color: var(--cyan); box-shadow: 0 0 20px rgba(127,224,255,.22); }
  .row .pos { width: 38px; text-align: center; font-family: "Chakra Petch", system-ui, sans-serif; font-size: 20px; font-weight: 700; color: var(--cyan); flex-shrink: 0; }
  .row .avatar { width: 52px; height: 52px; margin: 0; }
  .row .name { flex: 1; min-width: 0; margin: 0; text-align: left; }
  .row .stats { text-align: right; font-size: 14px; color: var(--mute); white-space: nowrap; }

  .status { text-align: center; color: var(--mute); padding: 20px; }
  .status[hidden] { display: none; }

  .modal { position: fixed; inset: 0; background: rgba(2,5,12,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal[hidden] { display: none; }
  .modal-box { position: relative; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; overflow-x: hidden; background: linear-gradient(#142042, #0a1020); border: 1px solid var(--cyan); border-radius: 22px; padding: 30px 24px; text-align: center;
               box-shadow: 0 0 40px rgba(127,224,255,.25); animation: modalIn .25s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes modalIn { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
  .modal-box .avatar { --av: 120px; margin-top: 8px; }
  .modal-box .name { white-space: normal; overflow: visible; font-size: 20px; }
  .modal-box h2 { margin: 18px 0 0; font-size: 15px; font-weight: 600; color: var(--cyan); }
  .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--mute); font-size: 28px; cursor: pointer; transition: color .2s; }
  .close:hover { color: var(--gold); }
  .roles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
  .chip { padding: 6px 12px; border-radius: 999px; font-size: 13px; border: 1px solid #5b6478; color: var(--text); background: rgba(255,255,255,.04); }

  @media (prefers-reduced-motion: reduce) {
    .spark { animation: none; opacity: 0; }
    .modal-box { animation: none; }
    .card, .row { transition: none; }
  }

  @media (max-width: 600px) {
    .wrap { padding: 14px 12px 36px; }
    h1 { font-size: 26px; margin-bottom: 14px; }
    .panel { padding: 22px 10px 14px; margin-top: 14px; border-radius: 18px; }
    .tabs { margin-bottom: 18px; }
    .tab { padding: 7px 18px; font-size: 13px; }

    .podium { gap: 6px; margin-bottom: 16px; align-items: flex-end; }
    .card { --av: 64px; --bd: 66px; padding: 12px 6px; border-radius: 14px; }
    .card.first { --av: 76px; --bd: 78px; padding-top: 16px; }
    .card.second { --av: 68px; --bd: 70px; }
    .card.third { --av: 60px; --bd: 62px; }
    .name { font-size: 14px; margin: 10px 0 2px; }
    .sub { font-size: 11px; line-height: 1.3; }
    .badge { margin-top: 4px; }
    .num { font-size: 22px; }
    .card.first .num { font-size: 26px; }
    .card.second .num { font-size: 23px; }
    .card.third .num { font-size: 19px; }

    .row { gap: 10px; padding: 10px 12px; flex-wrap: wrap; row-gap: 4px; }
    .row .pos { width: 24px; font-size: 16px; }
    .row .avatar { width: 44px; height: 44px; }
    .row .name { font-size: 14px; flex: 1; min-width: 0; }
    .row .stats { order: 4; width: 100%; text-align: left; padding-left: 58px; font-size: 12px; }

    .search { font-size: 16px; padding: 12px 14px 12px 44px; }
    .modal { padding: 12px; }
    .modal-box { padding: 24px 16px; }
    .modal-box .avatar { --av: 104px; }
    .back { font-size: 13px; padding: 8px 13px; }
  }

  @media (max-width: 360px) {
    .card { --av: 56px; --bd: 58px; padding: 10px 4px; }
    .card.first { --av: 66px; --bd: 68px; }
    .card.second { --av: 60px; --bd: 62px; }
    .card.third { --av: 52px; --bd: 54px; }
    .name { font-size: 13px; }
    .sub { font-size: 10px; }
    .num { font-size: 19px; }
    .card.first .num { font-size: 22px; }
    .card.second .num { font-size: 20px; }
    .card.third .num { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Volver al server</a>
  </div>

  <input class="search" id="search" type="search" placeholder="Buscar..." autocomplete="off">
  <div class="panel">
    <h1 id="title">Top Niveles</h1>
    <div class="tabs">
      <button class="tab active" data-tab="actual">Actual</button>
      <button class="tab" data-tab="y2025">2025</button>
    </div>
    <div id="podium" class="podium"></div>
    <div id="list"></div>
    <div id="status" class="status">Cargando...</div>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="close" aria-label="Cerrar">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const DATA_FILES = { actual: "top.json", y2025: "2025.json" };
const TITLES = { actual: "Top Niveles", y2025: "Top Niveles 2025" };
const MEDAL = { 1: "#ffc800", 2: "#c0c6d4", 3: "#cd7f32" };

const SPARKS = {
  1: { n: 26, dur: [.5, 1.0], rise: [110, 200], size: [3, 8], max: 1,   delay: [0, 1.2] },
  2: { n: 12, dur: [1.2, 2.0], rise: [50, 95],  size: [2, 5], max: .6, delay: [0, 2.5] },
  3: { n: 14, dur: [1.6, 2.6], rise: [40, 80],  size: [2, 4], max: .8, delay: [0, 3.0] },
};

let mode = "actual";
let loaded = false;
let loadError = false;
const datasets = { actual: [], y2025: [] };
let current = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("es-AR");
const safeColor = (c, fallback) => /^#[0-9a-f]{6}$/i.test(c || "") ? c : fallback;
const rnd = (a, b) => a + Math.random() * (b - a);

function avatarHTML(u) {
  const pfp = u.avatar || "https://cdn.discordapp.com/embed/avatars/0.png";
  const deco = u.decoration ? `<img class="deco" src="${esc(u.decoration)}" alt="">` : "";
  return `<div class="avatar"><img class="pfp" src="${esc(pfp)}" alt="">${deco}</div>`;
}

function laurelSVG(color) {
  const P = [[50, 90], [14, 86], [0, 46], [20, 12]];

  const pt = t => {
    const u = 1 - t;
    const x = u*u*u*P[0][0] + 3*u*u*t*P[1][0] + 3*u*t*t*P[2][0] + t*t*t*P[3][0];
    const y = u*u*u*P[0][1] + 3*u*u*t*P[1][1] + 3*u*t*t*P[2][1] + t*t*t*P[3][1];
    return [x, y];
  };

  const angleAt = t => {
    const u = 1 - t;
    const dx = 3*u*u*(P[1][0]-P[0][0]) + 6*u*t*(P[2][0]-P[1][0]) + 3*t*t*(P[3][0]-P[2][0]);
    const dy = 3*u*u*(P[1][1]-P[0][1]) + 6*u*t*(P[2][1]-P[1][1]) + 3*t*t*(P[3][1]-P[2][1]);
    return Math.atan2(dy, dx) * 180 / Math.PI;
  };

  const leaf = (x, y, a) =>
    `<path d="M0 0 Q5 -4.5 10 0 Q5 4.5 0 0Z" fill="${color}"
       transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)})"/>`;

  let branch = `<path d="M${P[0][0]} ${P[0][1]} C${P[1][0]} ${P[1][1]} ${P[2][0]} ${P[2][1]} ${P[3][0]} ${P[3][1]}"
                  fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round"/>`;

  for (let i = 0; i < 8; i++) {
    const t = 0.14 + i * 0.11;
    const [x, y] = pt(t);
    const a = angleAt(t);
    branch += leaf(x, y, a + 38);
    branch += leaf(x, y, a - 38);
  }

  return `<svg class="laurel" viewBox="0 0 100 100" aria-hidden="true">
    ${branch}
    <g transform="translate(100 0) scale(-1 1)">${branch}</g>
  </svg>`;
}

function fillSparks(el, pos) {
  const cfg = SPARKS[pos];
  const color = MEDAL[pos];
  let html = "";
  for (let i = 0; i < cfg.n; i++) {
    const left = rnd(0, 100);
    const top = rnd(55, 100);
    const dur = rnd(cfg.dur[0], cfg.dur[1]);
    const delay = rnd(cfg.delay[0], cfg.delay[1]);
    const rise = rnd(cfg.rise[0], cfg.rise[1]);
    const size = rnd(cfg.size[0], cfg.size[1]);
    const dx = rnd(-18, 18);
    html += `<span class="spark" style="--c:${color};--max:${cfg.max};left:${left}%;top:${top}%;--d:${dur.toFixed(2)}s;--dl:${delay.toFixed(2)}s;--ry:${rise.toFixed(0)}px;--dx:${dx.toFixed(0)}px;--s:${size.toFixed(1)}px"></span>`;
  }
  el.innerHTML = html;
}

function cardHTML(u, cls) {
  return `<div class="card ${cls}" data-pos="${u.pos}">
    <div class="fx"></div>
    ${avatarHTML(u)}
    <div class="name">${esc(u.name)}</div>
    <div class="sub">Nivel ${u.level} · ${fmt(u.xp)} XP</div>
    <div class="badge">${laurelSVG(MEDAL[u.pos])}<span class="num" style="color:${MEDAL[u.pos]}">${u.pos}</span></div>
  </div>`;
}

function rowHTML(u) {
  return `<div class="row" data-pos="${u.pos}">
    <div class="pos">${u.pos}</div>
    ${avatarHTML(u)}
    <div class="name">${esc(u.name)}</div>
    <div class="stats">Nivel ${u.level} · ${fmt(u.xp)} XP</div>
  </div>`;
}

function render(term = "") {
  const podium = document.getElementById("podium");
  const list = document.getElementById("list");
  const status = document.getElementById("status");

  if (!current.length) {
    podium.innerHTML = "";
    list.innerHTML = "";
    status.hidden = false;
    if (!loaded) status.textContent = "Cargando...";
    else if (loadError && mode === "actual") status.textContent = "No se pudo cargar el ranking.";
    else if (mode === "y2025") status.textContent = "Todavía no hay datos de 2025.";
    else status.textContent = "No hay usuarios todavía.";
    return;
  }
  status.hidden = true;

  const t = term.trim().toLowerCase();
  if (t) {
    podium.innerHTML = "";
    const matches = current.filter(u => u.name.toLowerCase().includes(t));
    list.innerHTML = matches.map(rowHTML).join("") || `<div class="status">Sin resultados</div>`;
    return;
  }

  const top = current.slice(0, 3);
  const slots = [[1, "second"], [0, "first"], [2, "third"]];
  podium.innerHTML = slots.filter(([i]) => top[i]).map(([i, c]) => cardHTML(top[i], c)).join("");

  podium.querySelectorAll(".card").forEach(card => {
    const pos = Number(card.dataset.pos);
    fillSparks(card.querySelector(".fx"), pos);
  });

  list.innerHTML = current.slice(3).map(rowHTML).join("");
}

function openModal(u) {
  let rolesBlock = "";
  if (mode === "actual") {
    const roles = u.roles || [];
    const chips = roles.length
      ? roles.map(r => {
          const c = safeColor(r.color, "#9aa6c2");
          return `<span class="chip" style="border-color:${c};color:${c}">${esc(r.name)}</span>`;
        }).join("")
      : `<div class="sub">Sin roles</div>`;
    rolesBlock = `<h2>Roles en el server</h2><div class="roles">${chips}</div>`;
  }

  document.getElementById("modal-body").innerHTML = `
    ${avatarHTML(u)}
    <div class="name" style="margin-top:14px">${esc(u.name)}</div>
    <div class="sub">#${u.pos} · Nivel ${u.level} · ${fmt(u.xp)} XP</div>
    ${rolesBlock}`;
  document.getElementById("modal").hidden = false;
}

function closeModal() {
  document.getElementById("modal").hidden = true;
}

function showMode() {
  current = [...datasets[mode]].sort((a, b) => b.xp - a.xp);
  current.forEach((u, i) => u.pos = i + 1);
  document.getElementById("title").textContent = TITLES[mode];
  render(document.getElementById("search").value);
}

async function fetchJSON(file) {
  const r = await fetch(`${file}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadAll() {
  try {
    datasets.actual = (await fetchJSON(DATA_FILES.actual)).users;
    loadError = false;
  } catch (e) {
    loadError = true;
  }
  try {
    datasets.y2025 = (await fetchJSON(DATA_FILES.y2025)).users;
  } catch (e) {
    datasets.y2025 = [];
  }
  loaded = true;
  showMode();
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));

document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  mode = btn.dataset.tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  showMode();
}));

document.addEventListener("click", e => {
  const el = e.target.closest("[data-pos]");
  if (!el) return;
  const u = current[Number(el.dataset.pos) - 1];
  if (u) openModal(u);
});

const modal = document.getElementById("modal");
modal.addEventListener("click", e => {
  if (e.target === modal || e.target.classList.contains("close")) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
