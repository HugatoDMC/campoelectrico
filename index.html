<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Niveles · Campo Eléctrico</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0b0f1a; color: #e8ecf5; min-height: 100vh; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }

  .search { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid #1e2740; background: #0d1222; color: #e8ecf5; font-size: 16px; outline: none; }
  .search:focus { border-color: #ffc800; }
  .panel { margin-top: 20px; background: #0d1222; border: 1px solid #1e2740; border-radius: 16px; padding: 24px; }
  h1 { text-align: center; color: #ffc800; margin: 0 0 24px; font-size: 32px; text-shadow: 0 0 12px rgba(255, 200, 0, .5); }

  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
  .card { position: relative; flex: 1; max-width: 230px; border-radius: 14px; text-align: center; padding: 16px 12px;
          background: #101728; border: 1px solid #1e2740; cursor: pointer;
          transition: transform .2s ease, box-shadow .2s ease; }
  .card.first { padding-top: 24px; background: linear-gradient(#2a2208, #0d1222); border-color: #ffc800; box-shadow: 0 0 25px rgba(255, 200, 0, .25); --glow: #ffc800; }
  .card.second { background: linear-gradient(#262a33, #0d1222); border-color: #9ca3af; --glow: #9ca3af; }
  .card.third { background: linear-gradient(#2e1b10, #0d1222); border-color: #a0622d; --glow: #a0622d; }
  .card:hover { transform: translateY(-6px); box-shadow: 0 0 26px var(--glow), 0 0 8px var(--glow); }

  .fx { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
  .spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--c); opacity: 0;
           box-shadow: 0 0 6px var(--c);
           animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
  @keyframes twinkle {
    0%   { opacity: 0; transform: translateY(0) scale(.5); }
    50%  { opacity: 1; transform: translateY(-12px) scale(1); }
    100% { opacity: 0; transform: translateY(-24px) scale(.4); }
  }

  .name { font-weight: 700; margin: 14px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 14px; color: #9aa6c2; }

  .avatar { position: relative; width: 96px; height: 96px; margin: 0 auto; }
  .avatar img.pfp { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1e2740; display: block; }
  .avatar img.deco { position: absolute; left: 50%; top: 50%; width: 140%; height: 140%; transform: translate(-50%, -50%); pointer-events: none; }

  .badge { position: relative; width: 90px; height: 90px; margin: 8px auto 0; display: flex; align-items: center; justify-content: center; }
  .laurel { position: absolute; inset: 0; width: 100%; height: 100%; }
  .num { position: relative; font-size: 34px; font-weight: 800; }

  .row { position: relative; display: flex; align-items: center; gap: 16px; background: #101728; border: 1px solid #6fb1ff; border-radius: 12px;
         padding: 10px 16px; margin-bottom: 8px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease;
         --glow: rgba(111, 177, 255, .45); }
  .row:hover { transform: translateY(-3px); box-shadow: 0 0 14px var(--glow), 0 0 4px var(--glow); }
  .row .pos { width: 36px; text-align: center; font-size: 20px; font-weight: 700; color: #9aa6c2; }
  .row .avatar { width: 52px; height: 52px; margin: 0; }
  .row .name { flex: 1; margin: 0; text-align: left; }
  .row .stats { text-align: right; font-size: 14px; color: #9aa6c2; white-space: nowrap; }

  .status { text-align: center; color: #9aa6c2; padding: 20px; }
  .status[hidden] { display: none; }

  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal[hidden] { display: none; }
  .modal-box { position: relative; width: 100%; max-width: 360px; background: #0d1222; border: 1px solid #1e2740; border-radius: 16px; padding: 28px 24px; text-align: center; }
  .modal-box h2 { margin: 16px 0 0; font-size: 14px; font-weight: 600; color: #9aa6c2; text-transform: uppercase; letter-spacing: .08em; }
  .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #9aa6c2; font-size: 26px; cursor: pointer; }
  .roles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
  .chip { padding: 6px 12px; border-radius: 999px; font-size: 13px; border: 1px solid #5b6478; color: #e8ecf5; background: rgba(255, 255, 255, .04); }

  @media (max-width: 600px) {
    .podium { gap: 8px; }
    .card { padding: 12px 6px; }
    .avatar { width: 72px; height: 72px; }
    .badge { width: 70px; height: 70px; }
    .num { font-size: 26px; }
    .row .stats { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <input class="search" id="search" type="search" placeholder="Buscar..." autocomplete="off">
  <div class="panel">
    <h1>Top Niveles</h1>
    <div id="podium" class="podium"></div>
    <div id="list"></div>
    <div id="status" class="status">Cargando...</div>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="close" aria-label="Cerrar">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const DATA_URL = "top.json";
const MEDAL = { 1: "#ffc800", 2: "#c0c6d4", 3: "#cd7f32" };

let all = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("es-AR");
const safeColor = (c, fallback) => /^#[0-9a-f]{6}$/i.test(c || "") ? c : fallback;

function avatarHTML(u) {
  const pfp = u.avatar || "https://cdn.discordapp.com/embed/avatars/0.png";
  const deco = u.decoration ? `<img class="deco" src="${esc(u.decoration)}" alt="">` : "";
  return `<div class="avatar"><img class="pfp" src="${esc(pfp)}" alt="">${deco}</div>`;
}

// Laurel: un tallo curvo por lado con hojas a lo largo, en espejo para el lado derecho
function laurelSVG(color) {
  const P = [[50, 92], [8, 80], [4, 34], [26, 8]];

  const pt = t => {
    const u = 1 - t;
    const x = u*u*u*P[0][0] + 3*u*u*t*P[1][0] + 3*u*t*t*P[2][0] + t*t*t*P[3][0];
    const y = u*u*u*P[0][1] + 3*u*u*t*P[1][1] + 3*u*t*t*P[2][1] + t*t*t*P[3][1];
    return [x, y];
  };

  const angleAt = t => {
    const u = 1 - t;
    const dx = 3*u*u*(P[1][0]-P[0][0]) + 6*u*t*(P[2][0]-P[1][0]) + 3*t*t*(P[3][0]-P[2][0]);
    const dy = 3*u*u*(P[1][1]-P[0][1]) + 6*u*t*(P[2][1]-P[1][1]) + 3*t*t*(P[3][1]-P[2][1]);
    return Math.atan2(dy, dx) * 180 / Math.PI;
  };

  let half = `<path d="M${P[0][0]} ${P[0][1]} C${P[1][0]} ${P[1][1]} ${P[2][0]} ${P[2][1]} ${P[3][0]} ${P[3][1]}"
                fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>`;

  for (let i = 0; i < 7; i++) {
    const t = 0.12 + i * 0.12;
    const [x, y] = pt(t);
    const a = angleAt(t);
    const xs = x.toFixed(1), ys = y.toFixed(1);
    half += `<ellipse cx="${xs}" cy="${ys}" rx="5" ry="2.4" fill="${color}"
              transform="rotate(${(a + 40).toFixed(1)} ${xs} ${ys})"/>`;
    half += `<ellipse cx="${xs}" cy="${ys}" rx="4.2" ry="2" fill="${color}" opacity=".8"
              transform="rotate(${(a - 40).toFixed(1)} ${xs} ${ys})"/>`;
  }

  return `<svg class="laurel" viewBox="0 0 100 100" aria-hidden="true">
    ${half}
    <g transform="translate(100 0) scale(-1 1)">${half}</g>
  </svg>`;
}

function fillSparks(el, color) {
  let html = "";
  for (let i = 0; i < 10; i++) {
    const left = Math.random() * 100;
    const top = 30 + Math.random() * 70;
    const dur = 2 + Math.random() * 2;
    const delay = Math.random() * 3;
    html += `<span class="spark" style="--c:${color};left:${left}%;top:${top}%;--d:${dur}s;--dl:${delay}s"></span>`;
  }
  el.innerHTML = html;
}

function cardHTML(u, cls) {
  return `<div class="card ${cls}" data-pos="${u.pos}">
    <div class="fx"></div>
    ${avatarHTML(u)}
    <div class="name">${esc(u.name)}</div>
    <div class="sub">Nivel ${u.level} · ${fmt(u.xp)} XP</div>
    <div class="badge">${laurelSVG(MEDAL[u.pos])}<span class="num" style="color:${MEDAL[u.pos]}">${u.pos}</span></div>
  </div>`;
}

function rowHTML(u) {
  return `<div class="row" data-pos="${u.pos}">
    <div class="pos">${u.pos}</div>
    ${avatarHTML(u)}
    <div class="name">${esc(u.name)}</div>
    <div class="stats">Nivel ${u.level} · ${fmt(u.xp)} XP</div>
  </div>`;
}

function render(term = "") {
  const t = term.trim().toLowerCase();
  const podium = document.getElementById("podium");
  const list = document.getElementById("list");

  if (t) {
    podium.innerHTML = "";
    const matches = all.filter(u => u.name.toLowerCase().includes(t));
    list.innerHTML = matches.map(rowHTML).join("") || `<div class="status">Sin resultados</div>`;
    return;
  }

  const top = all.slice(0, 3);
  const slots = [[1, "second"], [0, "first"], [2, "third"]];
  podium.innerHTML = slots.filter(([i]) => top[i]).map(([i, c]) => cardHTML(top[i], c)).join("");

  podium.querySelectorAll(".card").forEach(card => {
    const pos = Number(card.dataset.pos);
    fillSparks(card.querySelector(".fx"), MEDAL[pos]);
  });

  list.innerHTML = all.slice(3).map(rowHTML).join("");
}

function openModal(u) {
  const roles = u.roles || [];
  const chips = roles.length
    ? roles.map(r => {
        const c = safeColor(r.color, "#9aa6c2");
        return `<span class="chip" style="border-color:${c};color:${c}">${esc(r.name)}</span>`;
      }).join("")
    : `<div class="sub">Sin roles</div>`;

  document.getElementById("modal-body").innerHTML = `
    ${avatarHTML(u)}
    <div class="name" style="margin-top:14px">${esc(u.name)}</div>
    <div class="sub">#${u.pos} · Nivel ${u.level} · ${fmt(u.xp)} XP</div>
    <h2>Roles en el server</h2>
    <div class="roles">${chips}</div>`;
  document.getElementById("modal").hidden = false;
}

function closeModal() {
  document.getElementById("modal").hidden = true;
}

async function load() {
  const status = document.getElementById("status");
  try {
    const r = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    all = data.users;
    status.hidden = true;
    render(document.getElementById("search").value);
  } catch (e) {
    status.hidden = false;
    status.textContent = "No se pudo cargar el ranking.";
  }
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));

document.addEventListener("click", e => {
  const el = e.target.closest("[data-pos]");
  if (!el) return;
  const u = all[Number(el.dataset.pos) - 1];
  if (u) openModal(u);
});

const modal = document.getElementById("modal");
modal.addEventListener("click", e => {
  if (e.target === modal || e.target.classList.contains("close")) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
