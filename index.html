<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo Eléctrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#060a14; --panel:rgba(10,16,32,.82); --line:#1b2a4a; --cyan:#7fe0ff; --blue:#4f9dff; --gold:#ffc800; --text:#e8eefb; --mute:#8f9dbd; --green:#3ddc84; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Chakra Petch", system-ui, -apple-system, sans-serif; background: radial-gradient(ellipse 80% 50% at 50% 100%, #0e2a4d 0%, transparent 70%), var(--bg); background-attachment: fixed; color: var(--text); min-height: 100vh; overflow-x: hidden; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  .hero { height: 240px; background: linear-gradient(135deg, #14214d, #0a0f20); position: relative; overflow: hidden; z-index: 1;
          -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent);
          animation: heroIn 1.1s cubic-bezier(.2,.7,.2,1) backwards; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 20px 56px; }

  .server-head { text-align: center; margin-top: -92px; position: relative; }
  .server-icon { width: 164px; height: 164px; margin: 0 auto; border-radius: 50%; border: 4px solid var(--bg);
                 background: #16213d; overflow: hidden; display: flex; align-items: center; justify-content: center;
                 font-size: 42px; font-weight: 700; color: var(--gold);
                 box-shadow: 0 0 0 2px var(--cyan), 0 0 0 7px rgba(127,224,255,.14), 0 0 46px rgba(127,224,255,.4);
                 animation: popIn .8s cubic-bezier(.2,.9,.3,1.25) .35s backwards; }
  .server-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { margin: 18px 0 0; font-size: 40px; font-weight: 700; letter-spacing: .02em; color: var(--gold); text-shadow: 0 0 18px rgba(255,200,0,.45), 0 0 2px rgba(255,200,0,.8); }

  .counts { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; padding: 7px 16px; border-radius: 999px;
            background: rgba(10,16,32,.7); border: 1px solid var(--line); font-size: 15px; color: var(--mute); }
  .counts .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .counts strong { color: var(--text); font-weight: 600; }
  .counts .sep { color: #34426a; }

  .creator { margin: 36px auto 0; max-width: 620px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center;
             padding: 18px 22px; border-radius: 24px; background: var(--panel); border: 1px solid var(--line);
             backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(127,224,255,.18); }
  .creator-avatar { position: relative; width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
                    border: 2px solid var(--gold); box-shadow: 0 0 18px rgba(255,200,0,.35); background: #16213d;
                    display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: var(--gold); }
  .creator-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .creator-info { flex: 1; min-width: 180px; }
  .creator-label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); }
  .creator-name { font-size: 22px; font-weight: 700; color: var(--text); }
  .creator-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .cbtn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; text-decoration: none;
          font-weight: 600; font-size: 15px; color: #fff; border: 1px solid transparent;
          transition: transform .2s ease, box-shadow .2s ease; }
  .cbtn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .cbtn:hover { transform: translateY(-2px); }
  .cbtn.yt { background: linear-gradient(135deg, #ff3b3b, #c4001d); box-shadow: 0 6px 18px rgba(255,40,40,.3); }
  .cbtn.yt:hover { box-shadow: 0 10px 26px rgba(255,40,40,.5); }
  .cbtn.dc { background: linear-gradient(135deg, #7289da, #4752c4); box-shadow: 0 6px 18px rgba(88,101,242,.3); }
  .cbtn.dc:hover { box-shadow: 0 10px 26px rgba(88,101,242,.5); }

  .content { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 40px; align-items: stretch; }

  .desc-card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 30px; min-height: 380px;
               backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(127,224,255,.18); }
  .desc-card::before { content: ""; position: absolute; left: 30px; top: -1px; width: 64px; height: 3px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 14px var(--gold); }
  .desc-card h2 { margin: 0 0 16px; font-size: 20px; font-weight: 600; color: var(--cyan); }
  .desc-card p { margin: 0; white-space: pre-line; line-height: 1.7; color: #d3dcf0; font-family: system-ui, -apple-system, sans-serif; max-width: 62ch; }

  .menu { display: flex; flex-direction: column; gap: 14px; }
  .menu-item { position: relative; display: flex; align-items: center; gap: 18px; padding: 12px 22px 12px 12px; border-radius: 20px;
               background: linear-gradient(90deg, rgba(20,32,60,.95), rgba(10,16,32,.9)); border: 1px solid var(--line); color: var(--text); text-decoration: none; overflow: hidden;
               transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; min-height: 88px; flex: 1; }
  .menu-item::before { content: ""; position: absolute; left: 0; top: 14%; bottom: 14%; width: 3px; border-radius: 0 3px 3px 0; background: var(--blue); box-shadow: 0 0 12px var(--blue); transition: background .25s, box-shadow .25s, top .25s, bottom .25s; }
  .menu-item:not(.locked):hover, .menu-item:not(.locked):focus-visible { transform: translateX(6px); border-color: var(--gold); box-shadow: 0 0 24px rgba(255,200,0,.28), 0 10px 30px rgba(0,0,0,.4); }
  .menu-item:not(.locked):hover::before { background: var(--gold); box-shadow: 0 0 14px var(--gold); top: 8%; bottom: 8%; }
  .menu-icon { width: 64px; height: 64px; flex-shrink: 0; border-radius: 16px; border: 1px solid rgba(127,224,255,.5);
               background: #0a1020; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .menu-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .menu-label { font-size: 19px; font-weight: 600; flex: 1; }
  .menu-item:not(.locked)::after { content: "›"; font-size: 30px; line-height: 1; color: var(--cyan); transition: transform .25s, color .25s; }
  .menu-item:not(.locked):hover::after { transform: translateX(4px); color: var(--gold); }
  .menu-item.locked { opacity: .55; cursor: not-allowed; border-style: dashed; }
  .menu-item.locked::before { background: #34426a; box-shadow: none; }
  .soon { font-size: 12px; color: var(--mute); border: 1px solid #34426a; padding: 4px 11px; border-radius: 999px; }

  .reveal { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) var(--d, 0s) backwards; }

  @keyframes heroIn { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes popIn  { from { opacity: 0; transform: scale(.6); }  to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .hero, .server-icon, .reveal { animation: none; }
    .menu-item, .menu-item::before, .menu-item::after, .cbtn { transition: none; }
  }

  @media (max-width: 760px) {
    .hero { height: 170px; }
    .server-head { margin-top: -64px; }
    .server-icon { width: 124px; height: 124px; font-size: 32px; }
    h1 { font-size: 28px; }
    .counts { font-size: 13px; }
    .creator { margin-top: 26px; padding: 16px; gap: 14px; }
    .creator-avatar { width: 64px; height: 64px; }
    .creator-name { font-size: 19px; }
    .cbtn { padding: 9px 14px; font-size: 14px; }
    .content { grid-template-columns: 1fr; gap: 20px; margin-top: 28px; }
    .desc-card { min-height: auto; padding: 24px 22px; }
    .menu-item { min-height: 76px; padding: 10px 16px 10px 10px; flex: none; }
    .menu-icon { width: 54px; height: 54px; }
    .menu-label { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="hero" id="hero"></div>

<div class="wrap">
  <div class="server-head">
    <div class="server-icon" id="icon-box"><span id="initials">CE</span></div>
    <h1 class="reveal" style="--d:.5s">Campo Eléctrico</h1>
    <div class="counts reveal" style="--d:.55s">
      <span class="dot"></span>
      <strong id="online">—</strong> online
      <span class="sep">•</span>
      <strong id="total">—</strong> miembros
    </div>
  </div>

  <section class="creator reveal" style="--d:.6s">
    <div class="creator-avatar">
      <span>E</span>
      <img src="assets/icons/ezhenatosdc.png" alt="Ezhenatos" onerror="this.remove()">
    </div>
    <div class="creator-info">
      <div class="creator-label">Creador del server</div>
      <div class="creator-name">Ezhenatos</div>
    </div>
    <div class="creator-btns">
      <a class="cbtn yt" href="https://www.youtube.com/@Ezhenatos" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>
        YouTube
      </a>
      <a class="cbtn dc" href="https://discord.gg/ezhenatos" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.25a18.27 18.27 0 0 0-5.487 0c-.164-.393-.406-.875-.618-1.25a.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056c2.053 1.508 4.041 2.423 5.993 3.029a.077.077 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.042-.106c-.652-.248-1.274-.55-1.872-.892a.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.007.128 12.3 12.3 0 0 1-1.873.891.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.029c1.961-.607 3.95-1.522 6.002-3.029a.077.077 0 0 0 .031-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.332-.947 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418z"/></svg>
        Discord
      </a>
    </div>
  </section>

  <div class="content">
    <section class="desc-card reveal" style="--d:.7s">
      <h2>Sobre el server</h2>
      <p id="desc">Cargando...</p>
    </section>

    <nav class="menu">
      <a class="menu-item reveal" style="--d:.8s" href="leaderboard.html">
        <span class="menu-icon"><img src="assets/icons/leaderboard.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Leaderboard niveles</span>
      </a>

      <div class="menu-item locked reveal" style="--d:.9s" aria-disabled="true">
        <span class="menu-icon"><img src="assets/icons/staff.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Conoce al staff</span>
        <span class="soon">Pronto</span>
      </div>

      <div class="menu-item locked reveal" style="--d:1s" aria-disabled="true">
        <span class="menu-icon"><img src="assets/icons/actividades.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Actividades que hacer</span>
        <span class="soon">Pronto</span>
      </div>

      <a class="menu-item reveal" style="--d:1.1s" href="events.html">
        <span class="menu-icon"><img src="assets/icons/events.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Eventos</span>
      </a>
    </nav>
  </div>
</div>

<script>
const SERVER_NAME = "Campo Eléctrico";

/* ---------- Rayos celestes desde abajo ---------- */
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, bolts = [];

function newBolt(initial) {
  return {
    x: Math.random() * W,
    y: initial ? Math.random() * H : H + Math.random() * 120,
    speed: 0.6 + Math.random() * 1.6,
    len: 40 + Math.random() * 90,
    width: 0.8 + Math.random() * 1.6,
    alpha: 0.25 + Math.random() * 0.55,
    seed: Math.random() * 1000,
  };
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const count = Math.max(12, Math.round(W / 45));
  bolts = Array.from({ length: count }, () => newBolt(true));
}

function drawBolt(b, t) {
  const segs = 6;
  const step = b.len / segs;
  let x = b.x, y = b.y;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 1; i <= segs; i++) {
    y -= step;
    x += Math.sin(b.seed + t * 0.003 + i * 1.7) * 4;
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = `rgba(150, 225, 255, ${b.alpha})`;
  ctx.lineWidth = b.width;
  ctx.shadowColor = "rgba(120, 210, 255, .9)";
  ctx.shadowBlur = 10;
  ctx.lineCap = "round";
  ctx.stroke();
}

function frame(t) {
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < bolts.length; i++) {
    const b = bolts[i];
    b.y -= b.speed * 1.4;
    if (b.y + b.len < -20) bolts[i] = newBolt(false);
    else drawBolt(b, t);
  }
  requestAnimationFrame(frame);
}

if (!reduceMotion) {
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  requestAnimationFrame(frame);
} else {
  canvas.style.display = "none";
}

/* ---------- Datos del server ---------- */
async function loadServer() {
  try {
    const r = await fetch(`server.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    applyServer(await r.json());
  } catch (e) {
    console.warn("No se pudo leer server.json:", e);
    applyServer({});
  }
}

function applyServer(data) {
  document.title = SERVER_NAME;

  setIcon(data.icon);

  document.getElementById("desc").textContent =
    data.description || "Un saludo a repli y a ezhenatos.";

  if (typeof data.online === "number") {
    document.getElementById("online").textContent = fmt(data.online);
  }
  if (typeof data.members === "number") {
    document.getElementById("total").textContent = fmt(data.members);
  }

  if (data.banner) {
    const hero = document.getElementById("hero");
    const img = document.createElement("img");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.onerror = () => { hero.innerHTML = ""; };
    img.src = data.banner;
    hero.innerHTML = "";
    hero.appendChild(img);
  }
}

function setIcon(url) {
  const box = document.getElementById("icon-box");
  box.innerHTML = `<span id="initials">CE</span>`;
  if (!url) return;

  const img = new Image();
  img.alt = "";
  img.referrerPolicy = "no-referrer";
  img.onload = () => {
    box.innerHTML = "";
    box.appendChild(img);
  };
  img.onerror = () => console.warn("No se pudo cargar el icono:", url);
  img.src = url;
}

function fmt(n) {
  return Number(n).toLocaleString("es-AR");
}

loadServer();
setInterval(loadServer, 60000);
</script>
</body>
</html>
