<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo Eléctrico</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0b0f1a; color: #e8ecf5; min-height: 100vh; }

  .hero { height: 220px; background: linear-gradient(135deg, #1a1f4a, #0d1222); position: relative; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px 48px; }

  .server-head { text-align: center; margin-top: -80px; position: relative; }
  .server-icon { width: 160px; height: 160px; margin: 0 auto; border-radius: 50%; border: 6px solid #0b0f1a;
                 background: #1e2740; overflow: hidden; display: flex; align-items: center; justify-content: center;
                 font-size: 42px; font-weight: 800; color: #ffc800; }
  .server-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { margin: 14px 0 0; font-size: 34px; color: #ffc800; text-shadow: 0 0 12px rgba(255, 200, 0, .4); }

  .content { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 36px; align-items: stretch; }

  .desc-card { background: #070a14; border: 1px solid #1e2740; border-radius: 18px; padding: 28px; min-height: 380px; }
  .desc-card h2 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: #9aa6c2; }
  .desc-card p { margin: 0; white-space: pre-line; line-height: 1.6; color: #d7deee; }

  .menu { display: flex; flex-direction: column; gap: 16px; }
  .menu-item { display: flex; align-items: center; gap: 18px; padding: 12px 24px 12px 12px; border-radius: 999px;
               background: #101728; border: 1px solid #6fb1ff; color: #e8ecf5; text-decoration: none;
               transition: transform .2s ease, box-shadow .2s ease; min-height: 88px; }
  .menu-item:not(.locked):hover { transform: translateY(-3px); box-shadow: 0 0 18px rgba(255, 200, 0, .5), 0 0 6px rgba(255, 200, 0, .7); border-color: #ffc800; }
  .menu-icon { width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; border: 2px solid #6fb1ff;
               background: #0d1222; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .menu-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .menu-label { font-size: 18px; font-weight: 700; flex: 1; }
  .menu-item.locked { opacity: .5; cursor: not-allowed; border-color: #2b3553; }
  .soon { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #9aa6c2; border: 1px solid #3b4666; padding: 4px 10px; border-radius: 999px; }

  @media (max-width: 760px) {
    .hero { height: 160px; }
    .server-head { margin-top: -60px; }
    .server-icon { width: 120px; height: 120px; font-size: 32px; }
    h1 { font-size: 26px; }
    .content { grid-template-columns: 1fr; gap: 20px; margin-top: 28px; }
    .desc-card { min-height: auto; }
    .menu-item { min-height: 76px; padding: 10px 18px 10px 10px; }
    .menu-icon { width: 54px; height: 54px; }
    .menu-label { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="hero" id="hero"></div>

<div class="wrap">
  <div class="server-head">
    <div class="server-icon" id="icon-box"><span id="initials">CE</span></div>
    <h1 id="server-name">Campo Eléctrico</h1>
  </div>

  <div class="content">
    <section class="desc-card">
      <h2>Sobre el server</h2>
      <p id="desc">Cargando...</p>
    </section>

    <nav class="menu">
      <a class="menu-item" href="leaderboard.html">
        <span class="menu-icon"><img src="assets/icons/leaderboard.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Leaderboard niveles</span>
      </a>

      <div class="menu-item locked" aria-disabled="true">
        <span class="menu-icon"><img src="assets/icons/staff.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Conoce al staff</span>
        <span class="soon">Pronto</span>
      </div>

      <div class="menu-item locked" aria-disabled="true">
        <span class="menu-icon"><img src="assets/icons/actividades.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Actividades que hacer</span>
        <span class="soon">Pronto</span>
      </div>

      <div class="menu-item locked" aria-disabled="true">
        <span class="menu-icon"><img src="assets/icons/eventos.png" alt="" onerror="this.remove()"></span>
        <span class="menu-label">Eventos</span>
        <span class="soon">Pronto</span>
      </div>
    </nav>
  </div>
</div>

<script>
const DEFAULT_NAME = "Campo Eléctrico";

async function loadServer() {
  try {
    const r = await fetch(`server.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    applyServer(data);
  } catch (e) {
    console.warn("No se pudo leer server.json:", e);
    applyServer({});
  }
}

function applyServer(data) {
  const name = data.name || DEFAULT_NAME;
  document.title = name;
  document.getElementById("server-name").textContent = name;

  setIcon(data.icon, name);

  document.getElementById("desc").textContent =
    data.description || "Bienvenido al server. Acá vas a encontrar el ranking de niveles, el staff y las actividades.";

  if (data.banner) {
    const hero = document.getElementById("hero");
    const img = document.createElement("img");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.onerror = () => { hero.innerHTML = ""; };
    img.src = data.banner;
    hero.innerHTML = "";
    hero.appendChild(img);
  }
}

function setIcon(url, name) {
  const box = document.getElementById("icon-box");
  const fallback = `<span id="initials">${initialsOf(name)}</span>`;
  box.innerHTML = fallback;

  if (!url) return;

  const img = new Image();
  img.alt = "";
  img.referrerPolicy = "no-referrer";
  img.onload = () => {
    box.innerHTML = "";
    box.appendChild(img);
  };
  img.onerror = () => console.warn("No se pudo cargar el icono:", url);
  img.src = url;
}

function initialsOf(name) {
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "CE";
}

loadServer();
</script>
</body>
</html>
